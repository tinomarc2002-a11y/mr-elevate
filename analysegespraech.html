<style>
:root{
  /* Helle, warme Basis – identisch zur Startseite */
  --bg:#f7f3ec; --bg-elev:#efe7d8; --bg-card:#fffdf8;
  --line:#e4dbc9; --line-strong:#cfc2a8;
  --fg:#211c17; --fg-muted:#5c5349; --fg-dim:#675e51;
  --accent-fill:#a8c93e; --accent-deep:#8fae2e; --accent-ink:#0a0d00; --on-accent:#f7f3ec;
  --accent-glow:rgba(168,201,62,.35);
  --accent:#3e6810; --amber:#95551a; --clay:#923d24;
  --ink:#0c0a0b;
  --radius:16px; --radius-sm:12px; --maxw-form:660px;
  --ease:cubic-bezier(.22,.61,.36,1); --t-fast:.18s var(--ease); --t:.3s var(--ease);
  --font-display:'Fraunces',Georgia,serif;
  --font-ui:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{ font-family:var(--font-body); background:var(--bg); color:var(--fg);
  line-height:1.6; font-size:16px; -webkit-font-smoothing:antialiased;
  min-height:100svh; display:flex; flex-direction:column; }
img{ display:block; max-width:100%; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
h1,h2,h3{ font-family:var(--font-display); font-weight:600; line-height:1.12; letter-spacing:-.02em; text-wrap:balance; }
:focus-visible{ outline:2.5px solid var(--accent); outline-offset:3px; border-radius:6px; }

/* ---------- Kopfzeile ---------- */
.kopf{ border-bottom:1px solid var(--line); background:var(--bg-card); }
.kopf-inner{ max-width:1100px; margin-inline:auto; padding:14px 22px;
  display:flex; align-items:center; justify-content:space-between; gap:16px; }
.brand-stack{ display:inline-flex; flex-direction:column; align-items:center; gap:3px; line-height:1; }
.brand-logo{ height:34px; width:auto; }
.brand-elevate{ font-family:var(--font-display); font-weight:600; font-size:.58rem; letter-spacing:.4em;
  text-transform:uppercase; color:var(--accent); padding-left:.4em; }
.zurueck{ font-family:var(--font-display); font-size:.9rem; color:var(--fg-muted); display:inline-flex; align-items:center; gap:7px; }
.zurueck:hover{ color:var(--accent); }

/* ---------- Fortschritt ---------- */
.fortschritt{ max-width:var(--maxw-form); margin:0 auto; padding:26px 22px 0; width:100%; }
.fortschritt-zeile{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
.fortschritt-text{ font-family:var(--font-ui); font-size:.76rem; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-dim); }
.fortschritt-balken{ display:flex; gap:6px; }
.fortschritt-balken i{ flex:1; height:6px; border-radius:100px; background:var(--line);
  transition:background var(--t), transform var(--t); transform-origin:left; }
.fortschritt-balken i.voll{ background:var(--accent-fill); }
.fortschritt-balken i.jetzt{ background:var(--accent); }

/* ---------- Bühne ---------- */
main{ flex:1; display:flex; align-items:flex-start; justify-content:center; padding:26px 22px 60px; }
.buehne{ width:100%; max-width:var(--maxw-form); }
.frage{ font-size:clamp(1.45rem,4.2vw,2.1rem); margin-bottom:8px; }
.frage-hilfe{ color:var(--fg-muted); font-size:.98rem; margin-bottom:26px; }

.schritt{ animation:rein .38s var(--ease) both; }
@keyframes rein{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }

/* ---------- Kacheln: immer 2x2 ---------- */
.kacheln{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.kachel{
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:0;
  background:var(--bg-card); border:2px solid var(--line); border-radius:var(--radius);
  overflow:hidden; text-align:center; padding:0; position:relative;
  transition:transform .16s cubic-bezier(.34,1.4,.64,1), border-color var(--t-fast), box-shadow var(--t-fast);
}
.kachel:hover{ border-color:var(--accent-fill); transform:translateY(-4px); box-shadow:0 14px 30px -18px var(--accent-glow); }
@media(hover:none){ .kachel:hover{ transform:none; } }
.kachel:active{ transform:scale(.985); }
.kachel.gewaehlt{ border-color:var(--accent); box-shadow:0 12px 28px -16px var(--accent-glow); }

.k-bild{ width:100%; height:104px; display:grid; place-items:center;
  background:rgba(168,201,62,.10); color:var(--accent); transition:background var(--t-fast), color var(--t-fast); }
.kachel:hover .k-bild{ background:rgba(168,201,62,.18); }
.kachel.gewaehlt .k-bild{ background:var(--accent-fill); color:var(--accent-ink); }
.k-bild svg{ animation:bildRein .4s var(--ease) backwards; }
@keyframes bildRein{ from{ opacity:0; transform:scale(.55) rotate(-10deg); } to{ opacity:1; transform:none; } }

.k-text{ padding:13px 12px 15px; font-size:.98rem; font-weight:600; line-height:1.25; color:var(--fg); }
.kachel.gewaehlt .k-text{ color:var(--accent); }

.k-haken{ position:absolute; top:10px; right:10px; width:24px; height:24px; border-radius:50%;
  background:var(--accent); color:var(--bg-card); display:grid; place-items:center;
  opacity:0; transform:scale(.5); transition:opacity var(--t-fast), transform var(--t-fast); }
.kachel.gewaehlt .k-haken{ opacity:1; transform:none; }

@media(max-width:400px){ .k-bild{ height:82px; } .k-text{ font-size:.9rem; padding:11px 8px 13px; } }

/* ---------- Kontaktschritt ---------- */
.felder{ display:grid; gap:12px; }
.feld input{ width:100%; padding:15px 16px; font-size:16px; font-family:inherit; color:var(--fg);
  background:var(--bg-card); border:2px solid var(--line); border-radius:var(--radius-sm);
  transition:border-color var(--t-fast), box-shadow var(--t-fast); }
.feld input::placeholder{ color:var(--fg-dim); opacity:.75; }
.feld input:focus{ outline:none; border-color:var(--accent); box-shadow:0 6px 18px -8px var(--accent-glow); }
.zustimmung{ display:flex; gap:11px; align-items:flex-start; margin-top:6px;
  font-size:.86rem; color:var(--fg-muted); line-height:1.5; }
.zustimmung input{ margin-top:3px; width:18px; height:18px; accent-color:var(--accent); flex-shrink:0; }
.zustimmung a{ color:var(--accent); text-decoration:underline; text-underline-offset:2px; }

/* ---------- Schaltflächen ---------- */
.aktionen{ display:flex; gap:12px; align-items:center; margin-top:26px; flex-wrap:wrap; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px;
  padding:15px 28px; min-height:52px; font-family:var(--font-display); font-weight:500; font-size:1rem;
  border-radius:100px; transition:transform var(--t-fast), background var(--t), color var(--t); }
.btn:active{ transform:scale(.97); }
.btn-haupt{ background:var(--bg-card); color:var(--accent); border:2px solid var(--accent); }
.btn-haupt:hover{ background:var(--accent); color:var(--on-accent); transform:translateY(-2px); }
.btn-haupt:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
.btn-still{ background:transparent; color:var(--fg-muted); border:1px solid var(--line-strong); }
.btn-still:hover{ color:var(--fg); border-color:var(--fg-dim); }
.hinweis{ font-size:.84rem; color:var(--fg-dim); margin-top:16px; }

/* ---------- Erfolg ---------- */
.erfolg{ text-align:center; padding:14px 0; animation:rein .4s var(--ease) both; }
.erfolg-zeichen{ width:76px; height:76px; margin:0 auto 20px; border-radius:50%;
  background:var(--accent-fill); color:var(--accent-ink); display:grid; place-items:center;
  animation:pop .5s var(--ease) both; }
@keyframes pop{ from{ opacity:0; transform:scale(.5); } to{ opacity:1; transform:none; } }
.erfolg h2{ font-size:clamp(1.6rem,4vw,2.2rem); margin-bottom:12px; }
.erfolg p{ color:var(--fg-muted); max-width:52ch; margin:0 auto 22px; }
.merkmale{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:26px; }
.merkmale span{ font-family:var(--font-ui); font-size:.78rem; padding:6px 13px; border-radius:100px;
  background:rgba(168,201,62,.12); color:var(--accent); }

.fuss{ border-top:1px solid var(--line); padding:20px 22px; text-align:center;
  font-size:.83rem; color:var(--fg-dim); }
.fuss a{ color:var(--fg-dim); text-decoration:underline; text-underline-offset:2px; }
.fuss a:hover{ color:var(--accent); }

@media (prefers-reduced-motion:reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>

<header class="kopf">
  <div class="kopf-inner">
    <a href="/" class="brand" aria-label="MR Elevate Startseite">
      <span class="brand-stack">
        <img class="brand-logo" src="logo-gruen.webp" alt="MR Elevate Logo" width="283" height="280" />

<script>
(function(){
  "use strict";

  var ICON = {
    briefcase:'<rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="3" y1="13" x2="21" y2="13"/>',
    gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/>',
    chat:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/>',
    spark:'<path d="M12 2l1.5 5.5L19 9l-5.5 1.5L12 16l-1.5-5.5L5 9l5.5-1.5z"/>',
    coin:'<circle cx="12" cy="12" r="9"/><path d="M15 8.5a4 4 0 1 0 0 7"/><line x1="7" y1="10" x2="13" y2="10"/><line x1="7" y1="14" x2="13" y2="14"/>',
    users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/>',
    share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/>',
    megaphone:'<path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
    help:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 1 1 5.83 1c0 2-3 2-3 4"/><line x1="12" y1="17" x2="12" y2="17.01"/>',
    zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
    calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
    clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>'
  };

  /* Vier Fragen mit je vier Antworten, damit jede Frage als 2x2 aufgeht.
     Die Werte gehen als Text an Formspree; "unter 500 €" wird unten
     ausgewertet und darf deshalb nicht umbenannt werden. */
  var schritte = [
    { key:'branche', frage:'In welcher Branche bist du unterwegs?', hilfe:'Damit ich weiß, worüber wir reden.',
      optionen:[
        { v:'Dienstleister', icon:ICON.briefcase },
        { v:'Handwerk', icon:ICON.gear },
        { v:'Coaching / Beratung', icon:ICON.chat },
        { v:'Sonstiges', icon:ICON.spark }
      ] },
    { key:'kundenwert', frage:'Was bringt dir ein neuer Kunde im Schnitt?', hilfe:'Gewinn, nicht Umsatz. Grobe Schätzung reicht.',
      optionen:[
        { v:'unter 500 €', icon:ICON.coin, groesse:15 },
        { v:'500–1.000 €', icon:ICON.coin, groesse:20 },
        { v:'1.000–5.000 €', icon:ICON.coin, groesse:26 },
        { v:'über 5.000 €', icon:ICON.coin, groesse:32 }
      ] },
    { key:'akquise', frage:'Wie kommen aktuell neue Kunden zu dir?', hilfe:'Der häufigste Weg genügt.',
      optionen:[
        { v:'Empfehlungen', icon:ICON.users },
        { v:'Social Media', icon:ICON.share },
        { v:'Bezahlte Werbung', icon:ICON.megaphone },
        { v:'Kaum bis gar nicht', icon:ICON.help }
      ] },
    { key:'timing', frage:'Wann soll sich etwas ändern?', hilfe:'Ehrlich, nicht höflich.',
      optionen:[
        { v:'Sofort', icon:ICON.zap },
        { v:'In 30 Tagen', icon:ICON.calendar },
        { v:'In den nächsten Monaten', icon:ICON.clock },
        { v:'Erst mal informieren', icon:ICON.book }
      ] },
    { key:'kontakt', frage:'Wohin darf ich deine Einschätzung schicken?', hilfe:'Ich melde mich nur, wenn ich echtes Potenzial sehe.', kontakt:true }
  ];

  var GESAMT = schritte.length;
  var stand = { idx:0, antworten:{}, kontakt:{} };

  var buehne = document.getElementById('buehne');
  var balken = document.getElementById('balken');
  var jetztEl = document.getElementById('schrittJetzt');
  document.getElementById('schrittGesamt').textContent = GESAMT;

  for (var i = 0; i < GESAMT; i++) { balken.appendChild(document.createElement('i')); }

  function schutz(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(z){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[z]; }); }

  function fortschritt(){
    jetztEl.textContent = Math.min(stand.idx + 1, GESAMT);
    Array.prototype.forEach.call(balken.children, function(el, n){
      el.className = n < stand.idx ? 'voll' : (n === stand.idx ? 'jetzt' : '');
    });
  }

  function zeichne(){
    var s = schritte[stand.idx];
    fortschritt();
    buehne.innerHTML = s.kontakt ? kontaktSchritt(s) : frageSchritt(s);
    verdrahte(s);
    var erstes = buehne.querySelector('.kachel, input');
    if (erstes && stand.idx > 0) { erstes.focus({ preventScroll:true }); }
  }

  function frageSchritt(s){
    var html = '<div class="schritt"><h1 class="frage">' + schutz(s.frage) + '</h1>' +
      (s.hilfe ? '<p class="frage-hilfe">' + schutz(s.hilfe) + '</p>' : '') +
      '<div class="kacheln" role="listbox" aria-label="' + schutz(s.frage) + '">';
    s.optionen.forEach(function(o, n){
      var gewaehlt = stand.antworten[s.key] === o.v;
      var gr = o.groesse || 30;
      html += '<button type="button" class="kachel' + (gewaehlt ? ' gewaehlt' : '') + '" role="option"' +
        ' aria-selected="' + gewaehlt + '" data-wert="' + encodeURIComponent(o.v) + '">' +
        '<span class="k-bild"><svg width="' + gr + '" height="' + gr + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:' + (n * 0.06) + 's">' + o.icon + '</svg></span>' +
        '<span class="k-text">' + schutz(o.v) + '</span>' +
        '<span class="k-haken" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M20 6 9 17l-5-5"/></svg></span>' +
        '</button>';
    });
    html += '</div><div class="aktionen">' +
      (stand.idx > 0 ? '<button type="button" class="btn btn-still" data-zurueck>Zurück</button>' : '') +
      '</div></div>';
    return html;
  }

  function kontaktSchritt(s){
    var k = stand.kontakt;
    return '<div class="schritt"><h1 class="frage">' + schutz(s.frage) + '</h1>' +
      '<p class="frage-hilfe">' + schutz(s.hilfe) + '</p>' +
      '<form id="formular" novalidate><div class="felder">' +
      '<div class="feld"><input type="text" name="name" placeholder="Dein Name" autocomplete="name" required value="' + schutz(k.name || '') + '" /></div>' +
      '<div class="feld"><input type="text" name="firma" placeholder="Firma (optional)" autocomplete="organization" value="' + schutz(k.firma || '') + '" /></div>' +
      '<div class="feld"><input type="email" name="email" placeholder="E-Mail-Adresse" autocomplete="email" required value="' + schutz(k.email || '') + '" /></div>' +
      '<div class="feld"><input type="tel" name="telefon" placeholder="Telefon (optional)" autocomplete="tel" value="' + schutz(k.telefon || '') + '" /></div>' +
      '</div>' +
      '<label class="zustimmung"><input type="checkbox" name="einwilligung" required />' +
      '<span>Ich bin damit einverstanden, dass Marc Richter mich zu meiner Anfrage per E-Mail oder Telefon kontaktiert. Mehr dazu in der <a href="/datenschutz">Datenschutzerklärung</a>.</span></label>' +
      '<div class="aktionen">' +
      '<button type="button" class="btn btn-still" data-zurueck>Zurück</button>' +
      '<button type="submit" class="btn btn-haupt" id="senden">Einschätzung anfordern' +
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>' +
      '</div><p class="hinweis" id="hinweis">Keine Newsletter, keine Weitergabe. Du kannst jederzeit widersprechen.</p>' +
      '</form></div>';
  }

  function verdrahte(s){
    var zurueck = buehne.querySelector('[data-zurueck]');
    if (zurueck) { zurueck.addEventListener('click', function(){ if (stand.idx > 0) { stand.idx--; zeichne(); } }); }

    if (!s.kontakt) {
      buehne.querySelectorAll('.kachel').forEach(function(k){
        k.addEventListener('click', function(){
          buehne.querySelectorAll('.kachel').forEach(function(x){
            x.classList.remove('gewaehlt'); x.setAttribute('aria-selected','false');
          });
          k.classList.add('gewaehlt'); k.setAttribute('aria-selected','true');
          stand.antworten[s.key] = decodeURIComponent(k.getAttribute('data-wert'));
          /* kurze Pause, damit die Auswahl sichtbar wird, bevor es weitergeht */
          setTimeout(function(){ stand.idx++; zeichne(); }, 260);
        });
      });
      return;
    }

    var form = document.getElementById('formular');
    form.addEventListener('submit', absenden);
  }

  function absenden(e){
    e.preventDefault();
    var form = e.target;
    var hinweis = document.getElementById('hinweis');
    var daten = {
      name: form.name.value.trim(),
      firma: form.firma.value.trim(),
      email: form.email.value.trim(),
      telefon: form.telefon.value.trim()
    };
    if (!daten.name || !daten.email || !/.+@.+\..+/.test(daten.email)) {
      hinweis.textContent = 'Bitte Name und eine gültige E-Mail-Adresse angeben.';
      hinweis.style.color = 'var(--clay)';
      return;
    }
    if (!form.einwilligung.checked) {
      hinweis.textContent = 'Ohne deine Einwilligung darf ich dich nicht kontaktieren.';
      hinweis.style.color = 'var(--clay)';
      return;
    }
    stand.kontakt = daten;

    var knopf = document.getElementById('senden');
    knopf.disabled = true;
    knopf.textContent = 'Wird gesendet…';
    hinweis.style.color = '';
    hinweis.textContent = 'Keine Newsletter, keine Weitergabe. Du kannst jederzeit widersprechen.';

    var a = stand.antworten;
    fetch('https://formspree.io/f/xvznajve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        Name: daten.name, Firma: daten.firma, email: daten.email, Telefon: daten.telefon,
        Branche: a.branche || '', Kundenwert: a.kundenwert || '',
        Akquise: a.akquise || '', Zeitrahmen: a.timing || '',
        _subject: 'Neue Analysegespräch-Anfrage von ' + daten.name
      })
    }).then(function(r){
      if (r.ok) { erfolg(); return; }
      throw new Error('senden fehlgeschlagen');
    }).catch(function(){
      knopf.disabled = false;
      knopf.textContent = 'Erneut senden';
      hinweis.textContent = 'Das hat gerade nicht geklappt. Schreib mir sonst direkt an info@mr-elevate.de.';
      hinweis.style.color = 'var(--clay)';
    });
  }

  function erfolg(){
    stand.idx = GESAMT;
    fortschritt();
    document.getElementById('fortschritt').hidden = true;
    var a = stand.antworten;
    var knapp = a.kundenwert === 'unter 500 €';
    var text = knapp
      ? 'Deine Anfrage ist da. Ehrlich gesagt entfaltet mein erfolgsbasiertes Modell seine Stärke vor allem ab etwa 500 € Kundenwert. Ich schaue mir deinen Fall trotzdem an und sage dir offen, was ich sehe.'
      : 'Deine Anfrage ist da. Ich melde mich persönlich mit einer ehrlichen Einschätzung, in der Regel innerhalb von 24 Stunden.';
    var name = (stand.kontakt.name || '').split(' ')[0];

    buehne.innerHTML =
      '<div class="erfolg">' +
      '<div class="erfolg-zeichen"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></div>' +
      '<h2>Geschafft' + (name ? ', ' + schutz(name) : '') + '!</h2>' +
      '<p>' + text + '</p>' +
      '<div class="merkmale">' +
      (a.branche ? '<span>' + schutz(a.branche) + '</span>' : '') +
      (a.kundenwert ? '<span>' + schutz(a.kundenwert) + '</span>' : '') +
      (a.timing ? '<span>' + schutz(a.timing) + '</span>' : '') +
      '</div>' +
      '<a class="btn btn-haupt" href="/leitfaden">Bis dahin: der kostenlose Ads-Leitfaden</a>' +
      '</div>';
  }

  zeichne();
})();
</script>
<script defer src="/consent.js"></script>
</body>
</html>
